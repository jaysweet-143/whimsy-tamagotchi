<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 800 320" width="800" height="320" role="img" aria-labelledby="t d">
  <title id="t">Fluff Puff the cat</title>
  <desc id="d">An animated black silhouette cat named Fluff Puff with big white eyes. She greets visitors with love and attitude, gets sleepy, and naps on a cushion in the right corner.</desc>

  <defs>
    <path id="heart" d="M0,0 c-6,-8 -18,-2 -10,8 l10,9 l10,-9 c8,-10 -4,-16 -10,-8z"/>
  </defs>

  <style>
    .k { fill: #16161c; }
    .ks { stroke: #16161c; }
    .whisk { stroke: #16161c; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    .zfill { fill: #7a6bb5; }
    @media (prefers-color-scheme: dark) {
      .whisk { stroke: #d8d0f0; }
      .hop { filter: drop-shadow(0 0 1.5px #ece6ff) drop-shadow(0 0 1.5px #ece6ff); }
      .tailstroke { stroke: #16161c; }
      .zfill { fill: #b9acf0; }
    }

    .scene { animation: scene 28s linear infinite; }
    @keyframes scene {
      0% { opacity: 0; } 2% { opacity: 1; } 96% { opacity: 1; } 99% { opacity: 0; } 100% { opacity: 0; }
    }

    /* walk to the right corner */
    .walker { animation: walk 28s linear infinite; }
    @keyframes walk {
      0%, 55% { transform: translateX(0px); animation-timing-function: ease-in-out; }
      70%, 100% { transform: translateX(440px); }
    }
    .hop { animation: hop 28s linear infinite; }
    @keyframes hop {
      0%, 55% { transform: translateY(0); }
      56.25% { transform: translateY(-12px); } 57.5% { transform: translateY(0); }
      58.75% { transform: translateY(-12px); } 60% { transform: translateY(0); }
      61.25% { transform: translateY(-12px); } 62.5% { transform: translateY(0); }
      63.75% { transform: translateY(-12px); } 65% { transform: translateY(0); }
      66.25% { transform: translateY(-12px); } 67.5% { transform: translateY(0); }
      68.75% { transform: translateY(-12px); } 70%, 100% { transform: translateY(0); }
    }

    /* settle down to sleep */
    .bodyg { transform-box: fill-box; transform-origin: 50% 100%; animation: squish 28s ease-in-out infinite; }
    @keyframes squish {
      0%, 70% { transform: scaleY(1) scaleX(1); }
      75%, 100% { transform: scaleY(0.84) scaleX(1.08); }
    }
    .head { transform-box: fill-box; transform-origin: 50% 100%; animation: nod 28s ease-in-out infinite; }
    @keyframes nod {
      0%, 44% { transform: translateY(0) rotate(0deg); }
      52%, 56% { transform: translateY(4px) rotate(-3deg); }
      60%, 70% { transform: translateY(6px) rotate(3deg); }
      75%, 100% { transform: translateY(22px) rotate(7deg); }
    }

    /* eyes */
    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4s infinite; }
    @keyframes blink { 0%, 92% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } 98%, 100% { transform: scaleY(1); } }
    .eyes-open { animation: eyesopen 28s linear infinite; }
    @keyframes eyesopen { 0%, 71% { opacity: 1; } 73%, 100% { opacity: 0; } }
    .lids { animation: lids 28s linear infinite; }
    @keyframes lids { 0%, 46% { opacity: 0; } 49%, 71% { opacity: 1; } 73%, 100% { opacity: 0; } }
    .eyes-closed { animation: eyesclosed 28s linear infinite; }
    @keyframes eyesclosed { 0%, 71% { opacity: 0; } 73%, 100% { opacity: 1; } }
    /* pupils glance around while she is awake */
    .glance { animation: glance 7s ease-in-out infinite; }
    @keyframes glance { 0%, 30% { transform: translate(0, 0); } 40%, 60% { transform: translate(5px, -1px); } 70%, 100% { transform: translate(0, 0); } }

    /* yawn */
    .yawn { transform-box: fill-box; transform-origin: 50% 0%; animation: yawn 28s ease-in-out infinite; }
    @keyframes yawn {
      0%, 45% { opacity: 0; transform: scale(0.2); }
      47% { opacity: 1; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.2); }
      53% { opacity: 1; transform: scale(0.8); }
      54%, 100% { opacity: 0; transform: scale(0.2); }
    }
    .smile { animation: smile 28s linear infinite; }
    @keyframes smile { 0%, 45% { opacity: 1; } 46%, 54% { opacity: 0; } 55%, 100% { opacity: 1; } }

    /* speech bubbles */
    .b { opacity: 0; transform-box: fill-box; transform-origin: 0% 100%; }
    .b1 { animation: b1 28s ease-out infinite; }
    .b2 { animation: b2 28s ease-out infinite; }
    .b3 { animation: b3 28s ease-out infinite; }
    .b4 { animation: b4 28s ease-out infinite; }
    @keyframes b1 { 0%, 4% { opacity: 0; transform: scale(0.7); } 6%, 16% { opacity: 1; transform: scale(1); } 18%, 100% { opacity: 0; transform: scale(0.9); } }
    @keyframes b2 { 0%, 18% { opacity: 0; transform: scale(0.7); } 20%, 31% { opacity: 1; transform: scale(1); } 33%, 100% { opacity: 0; transform: scale(0.9); } }
    @keyframes b3 { 0%, 33% { opacity: 0; transform: scale(0.7); } 35%, 44% { opacity: 1; transform: scale(1); } 46%, 100% { opacity: 0; transform: scale(0.9); } }
    @keyframes b4 { 0%, 47% { opacity: 0; transform: scale(0.7); } 49%, 58% { opacity: 1; transform: scale(1); } 60%, 100% { opacity: 0; transform: scale(0.9); } }

    /* hearts */
    .hearts { opacity: 0; animation: hearts 28s linear infinite; }
    @keyframes hearts { 0%, 4% { opacity: 0; } 6%, 15% { opacity: 1; } 17%, 100% { opacity: 0; } }
    .float { animation: float 2s ease-in-out infinite; }
    .float.d2 { animation-delay: 0.7s; }
    .float.d3 { animation-delay: 1.3s; }
    @keyframes float { 0% { transform: translateY(8px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(8px); } }

    /* sleepy zzz */
    .zwrap { opacity: 0; animation: zwrap 28s linear infinite; }
    @keyframes zwrap { 0%, 74% { opacity: 0; } 76%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .z { font-family: "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 700; animation: z 3s ease-in-out infinite; }
    .z.z2 { animation-delay: 1s; }
    .z.z3 { animation-delay: 2s; }
    @keyframes z { 0% { transform: translate(0, 10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(14px, -24px); opacity: 0; } }

    .bubble-text { font-family: "Trebuchet MS", "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #4c1d95; text-anchor: middle; }
  </style>

  <g class="scene">
    <!-- cushion in the right corner -->
    <ellipse cx="650" cy="254" rx="82" ry="15" fill="#8b5cf6"/>
    <ellipse cx="650" cy="249" rx="74" ry="11" fill="#b794f6"/>
    <path d="M612,249 l2,-4 l2,4 l-4,-2.5 h4z M650,252 l2,-4 l2,4 l-4,-2.5 h4z M686,249 l2,-4 l2,4 l-4,-2.5 h4z" fill="#ede3ff"/>

    <g transform="translate(200,250)">
      <g class="walker">
        <!-- soft shadow -->
        <ellipse cx="0" cy="2" rx="70" ry="9" fill="#000" opacity="0.12"/>
        <g class="hop">

          <!-- tail, a long curl with a little hook -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-8 52 -20; 12 52 -20; -8 52 -20" dur="1.6s" repeatCount="indefinite"/>
            <path class="ks tailstroke" d="M52,-20 C112,-20 120,-95 94,-130 C86,-142 98,-152 108,-142" stroke-width="14" stroke-linecap="round" fill="none"/>
          </g>

          <!-- body and paws -->
          <g class="bodyg">
            <ellipse class="k" cx="0" cy="-48" rx="53" ry="50"/>
            <ellipse class="k" cx="-22" cy="-7" rx="18" ry="10"/>
            <ellipse class="k" cx="22" cy="-7" rx="18" ry="10"/>
            <path d="M-27,-10 v6 M-19,-10 v6 M19,-10 v6 M27,-10 v6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          </g>

          <!-- head -->
          <g class="head">
            <!-- ears -->
            <path class="k" d="M-46,-118 Q-48,-168 -40,-182 Q-20,-170 -6,-146 Z"/>
            <path class="k" d="M46,-118 Q48,-168 40,-182 Q20,-170 6,-146 Z"/>
            <path d="M-40,-132 Q-41,-160 -37,-168 Q-26,-160 -20,-146 Z" fill="#33333d"/>
            <path d="M40,-132 Q41,-160 37,-168 Q26,-160 20,-146 Z" fill="#33333d"/>
            <!-- face with fluffy cheek tufts and a forehead tuft -->
            <ellipse class="k" cx="0" cy="-108" rx="50" ry="42"/>
            <path class="k" d="M-46,-104 L-72,-96 L-48,-88 Z M-44,-92 L-68,-80 L-42,-78 Z M46,-104 L72,-96 L48,-88 Z M44,-92 L68,-80 L42,-78 Z"/>


            <!-- witch hat -->
            <g transform="rotate(7 0 -140)">
              <ellipse cx="0" cy="-140" rx="64" ry="13" fill="#6d3fc4"/>
              <ellipse cx="0" cy="-142" rx="62" ry="11" fill="#7c4dd8"/>
              <path d="M-38,-142 C-30,-190 -12,-225 10,-250 C20,-262 38,-262 50,-250 C34,-246 28,-240 28,-228 C34,-196 38,-168 38,-142 Q0,-130 -38,-142 Z" fill="#8b5cf6"/>
              <path d="M-26,-176 C-18,-205 -6,-228 8,-246" stroke="#b794f6" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
              <path d="M-38,-144 Q0,-132 38,-144 L36,-160 Q0,-148 -36,-160 Z" fill="#d9c2ff"/>
              <path d="M-7,-153 h14 v9 h-14 z" fill="#ffd166"/>
              <path d="M-3.5,-151 h7 v5 h-7 z" fill="#d9c2ff"/>
              <path d="M6,-208 l2.6,6 l6.4,0.6 l-4.9,4.2 l1.6,6.3 l-5.7,-3.4 l-5.7,3.4 l1.6,-6.3 l-4.9,-4.2 l6.4,-0.6 z" fill="#ffe69a"/>
              <circle cx="-14" cy="-190" r="2" fill="#ede3ff"/>
              <circle cx="22" cy="-176" r="1.6" fill="#ede3ff"/>
            </g>

            <!-- big white eyes -->
            <circle cx="-19" cy="-112" r="13" fill="#fff"/>
            <circle cx="19" cy="-112" r="13" fill="#fff"/>
            <g class="eyes-open">
              <g class="blink">
                <g class="glance">
                  <circle class="k" cx="-17" cy="-111" r="7"/>
                  <circle class="k" cx="21" cy="-111" r="7"/>
                  <circle cx="-19" cy="-114" r="2.4" fill="#fff"/>
                  <circle cx="19" cy="-114" r="2.4" fill="#fff"/>
                </g>
              </g>
            </g>
            <!-- sleepy lids -->
            <g class="lids">
              <path class="k" d="M-34,-112 A15,15 0 0 1 -4,-112 Q-19,-103 -34,-112 Z"/>
              <path class="k" d="M4,-112 A15,15 0 0 1 34,-112 Q19,-103 4,-112 Z"/>
              <path d="M-32,-111 Q-19,-104 -6,-111 M6,-111 Q19,-104 32,-111" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            </g>
            <!-- closed eyes: the eye shapes are covered, a happy curve shows -->
            <g class="eyes-closed">
              <path class="k" d="M-34,-126 L-4,-126 L-4,-96 L-34,-96 Z M4,-126 L34,-126 L34,-96 L4,-96 Z"/>
              <path d="M-31,-110 Q-19,-101 -7,-110 M7,-110 Q19,-101 31,-110" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            </g>

            <!-- nose and mouth -->
            <use href="#heart" transform="translate(0,-98) scale(0.5)" fill="#fff"/>
            <g class="smile">
              <path d="M0,-90 Q-6,-83 -12,-87 M0,-90 Q6,-83 12,-87" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            </g>
            <g class="yawn">
              <ellipse cx="0" cy="-84" rx="11" ry="13" fill="#e8607a"/>
              <ellipse cx="0" cy="-77" rx="6.5" ry="5" fill="#ff9eb5"/>
            </g>

            <!-- whiskers -->
            <path class="whisk" d="M-50,-102 Q-72,-112 -96,-112 M-50,-95 Q-74,-96 -98,-94 M-50,-88 Q-72,-80 -94,-74 M50,-102 Q72,-112 96,-112 M50,-95 Q74,-96 98,-94 M50,-88 Q72,-80 94,-74"/>
          </g>

          <!-- greeting hearts -->
          <g class="hearts">
            <g transform="translate(-62,-190)"><g class="float"><use href="#heart" fill="#ff6b8b"/></g></g>
            <g transform="translate(-96,-150) scale(0.7)"><g class="float d2"><use href="#heart" fill="#ff93ab"/></g></g>
            <g transform="translate(-30,-215) scale(0.55)"><g class="float d3"><use href="#heart" fill="#ff6b8b"/></g></g>
          </g>

          <!-- speech bubbles -->
          <g class="b b1">
            <rect x="82" y="-222" width="330" height="48" rx="24" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3"/>
            <path d="M100,-176 L80,-158 L126,-174 Z" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
            <rect x="96" y="-178" width="34" height="6" fill="#f3eaff"/>
            <text class="bubble-text" x="247" y="-193">Hellooo, gorgeous! I'm Fluff Puff.</text>
          </g>
          <g class="b b2">
            <rect x="82" y="-222" width="330" height="48" rx="24" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3"/>
            <path d="M100,-176 L80,-158 L126,-174 Z" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
            <rect x="96" y="-178" width="34" height="6" fill="#f3eaff"/>
            <text class="bubble-text" x="247" y="-193">Yes, you. Late, but I forgive you.</text>
          </g>
          <g class="b b3">
            <rect x="82" y="-222" width="330" height="48" rx="24" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3"/>
            <path d="M100,-176 L80,-158 L126,-174 Z" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
            <rect x="96" y="-178" width="34" height="6" fill="#f3eaff"/>
            <text class="bubble-text" x="247" y="-193">Admire the fluff. Touching costs extra.</text>
          </g>
          <g class="b b4">
            <rect x="82" y="-222" width="330" height="48" rx="24" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3"/>
            <path d="M100,-176 L80,-158 L126,-174 Z" fill="#f3eaff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
            <rect x="96" y="-178" width="34" height="6" fill="#f3eaff"/>
            <text class="bubble-text" x="247" y="-193">*yawn* Is it nap o'clock already?</text>
          </g>

          <!-- zzz -->
          <g class="zwrap">
            <text class="z zfill" x="66" y="-130" font-size="18">z</text>
            <text class="z z2 zfill" x="76" y="-146" font-size="24">Z</text>
            <text class="z z3 zfill" x="88" y="-162" font-size="30">Z</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
